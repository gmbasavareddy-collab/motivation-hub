<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0">

<title>Motivation Hub</title>

<style>

/* =========================
   BASIC SETTINGS
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family: Arial, sans-serif;

    color: white;

    background:
        linear-gradient(
            rgba(5,10,20,0.88),
            rgba(5,10,20,0.95)
        ),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80");

    background-size: cover;

    background-position: center;

    background-attachment: fixed;

    min-height: 100vh;
}


/* =========================
   HEADER
========================= */

header {

    text-align: center;

    padding: 55px 20px 45px;

    background:
        linear-gradient(
            135deg,
            rgba(245,158,11,0.25),
            rgba(15,23,42,0.5)
        );

    border-bottom:
        1px solid rgba(255,255,255,0.15);
}

header h1 {

    font-size: 42px;

    margin-bottom: 12px;

    text-shadow:
        0 5px 20px black;
}

header p {

    font-size: 17px;

    color: #dbeafe;
}


/* =========================
   NAVIGATION
========================= */

nav {

    position: sticky;

    top: 0;

    z-index: 10;

    display: flex;

    justify-content: center;

    gap: 8px;

    flex-wrap: wrap;

    padding: 13px;

    background:
        rgba(2,6,23,0.90);

    backdrop-filter: blur(12px);

    border-bottom:
        1px solid rgba(255,255,255,0.1);
}

nav button {

    border: none;

    padding: 9px 15px;

    border-radius: 20px;

    background: #1e293b;

    color: white;

    cursor: pointer;

    font-weight: bold;
}

nav button:hover {

    background: #f59e0b;

    color: black;
}


/* =========================
   MAIN
========================= */

.container {

    width: 92%;

    max-width: 1100px;

    margin: auto;
}


/* =========================
   SEARCH
========================= */

.search {

    margin: 30px auto;

    text-align: center;
}

.search input {

    width: 100%;

    max-width: 650px;

    padding: 16px 22px;

    border: none;

    outline: none;

    border-radius: 30px;

    font-size: 16px;

    background:
        rgba(255,255,255,0.95);

    color: #111827;
}


/* =========================
   HERO QUOTE
========================= */

.hero {

    position: relative;

    overflow: hidden;

    min-height: 330px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 35px;

    margin-bottom: 40px;

    border-radius: 28px;

    background:

        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.75)
        ),

        url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=80");

    background-size: cover;

    background-position: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
}

.hero-content {

    max-width: 750px;

    position: relative;

    z-index: 2;
}

.hero h2 {

    color: #fbbf24;

    margin-bottom: 20px;

    font-size: 22px;
}

#randomQuote {

    font-size: 29px;

    font-weight: bold;

    line-height: 1.5;
}

#randomAuthor {

    margin-top: 18px;

    color: #fde68a;

    font-size: 18px;
}

.newQuote {

    margin-top: 25px;

    padding: 14px 25px;

    border: none;

    border-radius: 30px;

    background: #f59e0b;

    color: black;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;
}

.newQuote:hover {

    transform: scale(1.05);
}


/* =========================
   SECTION TITLE
========================= */

.section-title {

    text-align: center;

    margin: 30px 0;

    font-size: 28px;
}


/* =========================
   QUOTE GRID
========================= */

.quotes {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

    gap: 22px;

    padding-bottom: 50px;
}


/* =========================
   QUOTE CARD
========================= */

.card {

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(30,41,59,0.96),
            rgba(15,23,42,0.96)
        );

    border:
        1px solid rgba(255,255,255,0.12);

    border-radius: 20px;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.3);

    transition: 0.3s;
}

.card:hover {

    transform:
        translateY(-7px);

    box-shadow:
        0 20px 45px rgba(0,0,0,0.5);
}


/* quote image */

.card-image {

    height: 150px;

    background-size: cover;

    background-position: center;

    position: relative;
}

.card-image::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,0.7)
        );
}


.card-content {

    padding: 22px;
}


.category {

    display: inline-block;

    padding: 5px 11px;

    border-radius: 20px;

    background: #334155;

    color: #fbbf24;

    font-size: 12px;

    margin-bottom: 14px;
}


.quote-text {

    font-size: 18px;

    line-height: 1.55;

    margin-bottom: 14px;
}


.author {

    color: #fbbf24;

    margin-bottom: 18px;
}


/* buttons */

.actions {

    display: flex;

    gap: 8px;
}

.actions button {

    flex: 1;

    border: none;

    padding: 9px;

    border-radius: 20px;

    cursor: pointer;

    font-weight: bold;
}

.favorite {

    background: #f59e0b;
}

.share {

    background: #38bdf8;
}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 40px 20px;

    background: #020617;

    color: #94a3b8;

    line-height: 2;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    header h1 {

        font-size: 31px;
    }

    #randomQuote {

        font-size: 22px;
    }

    .hero {

        min-height: 360px;

        padding: 25px 18px;
    }

    .quotes {

        grid-template-columns: 1fr;
    }

}

</style>

</head>

/* =========================
   DISPLAY
========================= */

function displayQuotes(list) {

    const container =
        document.getElementById("quotesContainer");

    container.innerHTML = "";

    list.forEach(function(q, index) {

        const card =
            document.createElement("div");

        card.className = "card";

        const image =
            images[index % images.length];

        card.innerHTML = `

            <div
                class="card-image"
                style="background-image:url('${image}')">
            </div>

            <div class="card-content">

                <span class="category">
                    ${q[2]}
                </span>

                <p class="quote-text">
                    "${q[0]}"
                </p>

                <p class="author">
                    — ${q[1]}
                </p>

                <div class="actions">

                    <button
                        class="favorite"
                        onclick="favoriteQuote('${q[0]}')">

                        ⭐ Favorite

                    </button>

                    <button
                        class="share"
                        onclick="shareQuote('${q[0]}','${q[1]}')">

                        📤 Share

                    </button>

                </div>

            </div>
        `;

        container.appendChild(card);

    });

}


/* =========================
   ALL
========================= */

function showAll() {

    displayQuotes(quotes);

}


/* =========================
   CATEGORY
========================= */

function filterQuotes(category) {

    const result =
        quotes.filter(function(q) {

            return q[2] === category;

        });

    displayQuotes(result);

}


/* =========================
   SEARCH
========================= */

function searchQuotes() {

    const value =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const result =
        quotes.filter(function(q) {

            return (

                q[0].toLowerCase()
                .includes(value)

                ||

                q[1].toLowerCase()
                .includes(value)

                ||

                q[2].toLowerCase()
                .includes(value)

            );

        });

    displayQuotes(result);

}


/* =========================
   RANDOM
========================= */

function newQuote() {

    const index =
        Math.floor(
            Math.random() * quotes.length
        );

    document.getElementById("randomQuote")
        .innerText =
        '"' + quotes[index][0] + '"';

    document.getElementById("randomAuthor")
        .innerText =
        "— " + quotes[index][1];

}


/* =========================
   FAVORITE
========================= */

function favoriteQuote(text) {

    alert(
        "⭐ Favorite saved!\n\n" + text
    );

}


/* =========================
   SHARE
========================= */

function shareQuote(text, author) {

    const message =
        '"' + text + '" — ' + author;

    if (navigator.share) {

        navigator.share({

            title: "Motivation Hub",

            text: message

        });

    } else {

        alert(message);

    }

}
